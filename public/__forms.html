<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Formulário Crivo</title>
  </head>
  <body>
    <form
      name="diagnostico-crivo"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="diagnostico-crivo" />
      <input type="hidden" name="subject" value="Novo diagnóstico Crivo" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <input name="project-type" />
      <input name="timeline" />
      <textarea name="message"></textarea>
      <input name="diagnosis-type" />
      <input name="diagnosis-score" />
      <input name="diagnosis-hours" />
      <input name="diagnosis-handoffs" />
      <input name="diagnosis-channels" />
      <textarea name="diagnosis-summary"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
