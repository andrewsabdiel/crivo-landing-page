<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Formulário Crivo</title>
  </head>
  <body>
    <form
      name="contato-crivo"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contato-crivo" />
      <input type="hidden" name="subject" value="Novo contato Crivo" />
      <input name="name" />
      <input name="contact" />
      <input name="project-type" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
