<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crivo - Abrir projeto</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:4173/" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0a1020;
        color: #fff;
      }

      main {
        width: min(34rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
      }

      a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crivo usa Next.js</h1>
      <p>
        O Go Live do VS Code abre arquivos estáticos, mas este projeto precisa do servidor
        Next.js.
      </p>
      <p>
        Se a página não abriu automaticamente, inicie o projeto com
        <strong>npm run dev</strong> e acesse
        <a href="http://localhost:4173/">http://localhost:4173/</a>.
      </p>
    </main>
  </body>
</html>
